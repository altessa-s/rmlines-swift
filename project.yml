# The framework wrapper, and nothing else.
#
# `Package.swift` beside this file is the real project: sources, tests, and
# what anyone developing the parser builds. This file exists for one reason —
# SwiftPM cannot produce a `.framework`, and an `.xcframework` is what the
# consumer asked for. So the same sources are compiled once more, here, as a
# framework target, and `Scripts/build-xcframework.sh` wraps the result.
#
# Dynamic, and for a reason. A static framework builds and
# links everywhere SwiftPM is in charge, but Xcode embeds a package's binary
# framework into the application bundle whatever it holds — it refuses a static
# one outright for want of an `Info.plist`, and would otherwise copy in two and
# a half megabytes nothing ever loads. Dynamic also means one copy of the
# parser in a process, which an application and its extensions can share
# through the bundle's `Frameworks`: two copies of a type in one process is how
# `catch let error as SomeError` quietly stops catching.
#
# Generated project, not committed: run the script.
name: RMLines

options:
  bundleIdPrefix: io.altessa
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # What makes the module readable by a later compiler than the one that
    # built it: the `.swiftinterface` beside the binary module. Without it the
    # framework would have to be rebuilt for every Xcode the consumers use.
    BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULE_DEBUGGING: "NO"

targets:
  RMLines:
    type: framework
    # One target, three slices — not three targets. `supportedDestinations`
    # keeps the scheme, the product name and the module name single; a target
    # split per platform would give XcodeGen leave to suffix all three, and the
    # script below archives by scheme name.
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources/RMLines
    settings:
      base:
        PRODUCT_NAME: RMLines
        PRODUCT_MODULE_NAME: RMLines
        # No bundle and no resources: the framework is the dynamic library
        # and its Swift module.
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "NO"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        # A framework without an `Info.plist` cannot be embedded in an
        # application bundle: Xcode's copy phase refuses it by name. Synthesised
        # rather than kept as a file, because there is nothing in it this
        # package has an opinion about.
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: io.altessa.rmlines
        # What a local build calls itself, and it is not a version: 0.0.0 says
        # "not a release". A release overrides it with the tag, through
        # `Scripts/build-xcframework.sh`. A higher default would let a local
        # framework outrank every release that has actually shipped.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INSTALL_PATH: /Library/Frameworks
        # Every slice the destination has, always: the consumer's release build
        # is universal, and a framework missing one fails the link rather than
        # the build. On macOS and the simulator that is two, on an iOS device
        # one — the script knows which to expect where.
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: "NO"
