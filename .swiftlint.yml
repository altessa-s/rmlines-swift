# SwiftLint for RMLines. Run it from the repository root: `swiftlint`.
#
# What this configuration is for: the mechanical mistakes a reader stops
# noticing — a force unwrap that takes the whole run down with a signal,
# `count == 0` where `isEmpty` was meant, a `%` that means `isMultiple(of:)`.
# What it is deliberately not for is the shape of the code. Those decisions
# this package has already made and written down in the comments above each
# one, and a linter repeating them at every build teaches nothing that review
# does not.
#
# Every rule that is off is off for a reason given on the spot. Two files are
# long on purpose: `RMParser.swift` and `RMWriter.swift`.

excluded:
  - .build
  - .swiftpm
  - build
  - DerivedData
  # RMLines.xcodeproj is generated by XcodeGen and not committed. It holds no
  # Swift of its own, so there is nothing here to exclude it from — it is
  # named only so that nobody adds it later thinking it was forgotten.

disabled_rules:
  # Size and complexity, the whole family. A binary format of this many records
  # is long because the thing it describes is long, and the two long files are
  # the shape the package asks for rather than a defect that survived review:
  #
  #   file_length              RMParser and RMWriter
  #   type_body_length         the RMParser namespace itself
  #   function_body_length     the block parsers, textBlock, RMWriter.page
  #   cyclomatic_complexity    the block parsers: the format's branches are
  #                            the function's
  #   function_parameter_count anchoredGroupBlocks — six fields of one record,
  #                            and a struct per record would be a type nobody
  #                            reads
  #   nesting                  SceneItem.Content, which belongs inside
  #                            SceneItem and nowhere else
  #
  # A rule that fires again and again on deliberate work trains people to read
  # past it, and then it is not there for the case that matters.
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - nesting

  # 370 trailing commas in multi-line literals, consistently, and 11 places the
  # rule would object to. That is a house style, and the linter does not get a
  # vote.
  - trailing_comma

  # Four occurrences, and the rule has them backwards here. It pushes
  # `String(decoding:as:)` towards the failable `String(data:encoding:)`, and
  # this parser wants the total one: bytes that are not UTF-8 come out as
  # replacement characters rather than as a `nil` that would lose a whole
  # paragraph of somebody's notebook.
  - optional_data_string_conversion

opt_in_rules:
  # Rules that are off by default and earn their place here: each one names a
  # spelling that hides intent — a count compared to zero, a filter whose only
  # use is `isEmpty`, a `%` that means `isMultiple(of:)`.
  #
  # None of these fires today. They are guards, not clean-up: the point is that
  # the first one to fire is new work, and is looked at.
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  # Zero force unwraps in the package today, product code and tests alike, and
  # that is the state worth keeping. Tests are not exempt: a `!` there ends the
  # whole run with a signal, so the case that failed is the one thing the
  # output does not name.
  - force_unwrapping
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unowned_variable_capture
  - yoda_condition

# `x`, `y`, `u`, `v` — 26 of them, and every one is a coordinate or a texture
# coordinate inside a point, a vertex or a rectangle. Short names are the
# readable ones there, and `xCoordinate` would be a worse name, not a longer
# one. The ceiling stays, because a forty-character name is a different
# problem.
identifier_name:
  min_length: 1

# Three members is what the tree actually holds — `(node, children, next)` in
# the scene walk, `(bytes, scalars, firstCharacters)` out of the text writer.
# Four is where a tuple stops being readable and wants a name.
large_tuple:
  warning: 3

# Prose is exempt — the long explanations above declarations are the point of
# this package, and wrapping them to a column would only make them worse. What
# is left is code, and code at 240 columns is not read, it is scrolled past.
line_length:
  warning: 120
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true
